[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "influencer_labeling"
version = "0.1.0"
description = "A compact synthetic influencer-labeling project with PyTorch Geometric."
requires-python = ">=3.11"
dependencies = ["torch>=2.11", "torch-geometric>=2.7", "matplotlib>=3.10", "networkx>=3.6"]

[project.scripts]
influencer-lab = "influencer_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["lab_tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"

[tool.setuptools.packages.find]
include = ["influencer_lab*"]

[tool.setuptools.package-data]
influencer_lab = []
